services:
  rift-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rift-arena-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      RIFT_DB_PATH: /app/data/rift.db
    volumes:
      - rift-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  rift-data:
